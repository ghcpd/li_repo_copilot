[project]
name = "doc-converter"
version = "0.1.0"
description = ""
authors = [
    {name = "copilot-swe-agent[bot]",email = "198982749+Copilot@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-docx==1.2.0",
    "beautifulsoup4==4.14.2",
    "lxml==6.0.2",
    "pydantic==2.12.3",
    "typer==0.20.0",
    "pypandoc==1.15",
    "pillow==12.0.0",
    "rich==14.2.0",
    "orjson==3.11.3",
    "markdown==3.9",
]

[project.optional-dependencies]
test = [
    "pytest==8.4.2",
    "pytest-cov==7.0.0",
    "pytest-mock==3.15.1",
]

[tool.poetry]
packages = [{include = "doc_converter", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
